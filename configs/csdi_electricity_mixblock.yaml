# DIHASILKAN oleh scripts/prepare_dataset.py. Blok train/diffusion/model identik dengan ETTh1 (hyperparameter dikunci).
base_config: configs/electricity_baseline.yaml
csdi_path: third_party/CSDI
train:
  epochs: 200
  batch_size: 16
  lr: 0.001
  itr_per_epoch: 100000000.0
diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: quad
  is_linear: false
model:
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  target_strategy: mix_block
adapter:
  window_len: 168
  windows_per_epoch: 1024
  val_windows_stride: 24
  val_missing_ratio: 0.3
  timepoints: relative
  block_lengths:
  - 24
  - 72
eval:
  nsample: 20
  stride: 24
  batch_size: 16
